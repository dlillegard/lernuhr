<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lernuhr</title>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=1">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 2rem;
      background-color: #f5f5f5;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 3rem;
      margin-bottom: 2rem;
      color: #222;
      letter-spacing: 1px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    .choice {
      text-decoration: none;
      color: black;
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 200px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .choice:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    }

    img {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    h2 {
      margin: 0.5rem 0 0.2rem;
    }
  </style>
</head>
<body>

  <h1>Lernuhr</h1>

  <div class="container">
    
    <a href="analoguhr.html" class="choice">
      <img src="analoguhr.png" alt="Analog klokke">
      <h2>Analoguhr</h2>
    </a>

    <a href="digitaluhr.html" class="choice">
      <img src="digitaluhr.png" alt="Digital klokke">
      <h2>Digitaluhr</h2>
    </a>

  </div>

</body>
</html>
