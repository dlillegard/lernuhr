<!-- Lernuhr Version 2.9: Unified drag area with hand preference on overlap -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernuhr</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    /* Klokka fyller 75% av høyden, holder proporsjoner */
    svg#clock {
      height: 75vh;
      width: auto;
      max-width: 100vw;
      touch-action: none; /* Ingen side-scroll ved drag */
      cursor: grab;
    }
    .hand { stroke-linecap: round; }
    .hour { stroke: #333; stroke-width: 6; }
    .minute { stroke: #e33; stroke-width: 4; }
    .second { stroke: gold; stroke-width: 2; }
    .center { fill: #333; }
    .mark { stroke: #666; stroke-width: 2; pointer-events: none; }
    svg text { pointer-events: none; }

    .btn {
      margin: 5px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
      background-color: white;
      border: 1px solid #333;
      border-radius: 4px;
      transition: background-color 0.2s;
    }
    .btn.active { background-color: gold; }
    .label { margin-top: 12px; font-size: 1.2rem; min-height: 1.5em; }
    @media (max-width: 400px) {
      .btn { margin: 4px 2px; padding: 6px 12px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <svg id="clock" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="95" fill="#fff" stroke="#000" stroke-width="4"/>
    <!-- Marker lines -->
    <!-- ... generated by script ... -->
    <!-- Hands -->
    <line id="hourHand" class="hand hour" x1="100" y1="100" x2="100" y2="60"/>
    <line id="minHand" class="hand minute" x1="100" y1="100" x2="100" y2="40"/>
    <line id="secHand" class="hand second" x1="100" y1="100" x2="100" y2="20" style="display:none;"/>
    <circle id="centerDot" cx="100" cy="100" r="3" class="center"/>
  </svg>
  <div>
    <button id="randBtn" class="btn">Zufällige Zeit</button>
    <button id="toggleSysBtn" class="btn active">Systemzeit</button>
    <button id="toggleTextBtn" class="btn">Text</button>
  </div>
  <div id="label" class="label"></div>
<script>
(function() {
  const svg = document.getElementById('clock');
  const hourHand = document.getElementById('hourHand');
  const minHand = document.getElementById('minHand');
  const secHand = document.getElementById('secHand');
  const label = document.getElementById('label');
  const randBtn = document.getElementById('randBtn');
  const toggleSysBtn = document.getElementById('toggleSysBtn');
  const toggleTextBtn = document.getElementById('toggleTextBtn');

  let lastH=0, lastM=0;
  let autoTime=true, intervalID;
  let showText=false;
  let draggingHour=false, draggingMin=false;
  let prevTotal=0, prevAngle=0;

  // Draw markers and numbers
  for(let i=0;i<60;i++){const ln=document.createElementNS('http://www.w3.org/2000/svg','line');const a=i*6*Math.PI/180;const l=i%5===0?10:4;const x1=100+Math.sin(a)*90;const y1=100-Math.cos(a)*90;const x2=100+Math.sin(a)*(90-l);const y2=100-Math.cos(a)*(90-l);ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',x2);ln.setAttribute('y2',y2);ln.classList.add('mark');svg.appendChild(ln);}  
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;const x=100+Math.sin(a)*75;const y=100-Math.cos(a)*75+6;const tn=document.createElementNS('http://www.w3.org/2000/svg','text');tn.setAttribute('x',x);tn.setAttribute('y',y);tn.setAttribute('text-anchor','middle');tn.setAttribute('font-size','16');tn.textContent=i;svg.appendChild(tn);}  

  function setHandsFromTotal(totalMin) {
    const tm=Math.round(((totalMin%720)+720)%720);
    const h=Math.floor(tm/60), m=tm%60;
    lastH=h; lastM=m;
    const minAng=m*6;
    const hrAng=(h%12 + m/60)*30;
    minHand.setAttribute('transform',`rotate(${minAng} 100 100)`);
    hourHand.setAttribute('transform',`rotate(${hrAng} 100 100)`);
    updateLabel();
  }

  function updateSystemTime() {
    const now=new Date();
    setHandsFromTotal(now.getHours()*60+now.getMinutes());
    if(autoTime && !draggingHour && !draggingMin) {
      const secAng=now.getSeconds()*6;
      secHand.setAttribute('transform',`rotate(${secAng} 100 100)`);
      secHand.style.display='';
    }
  }

  function startAuto() {
    autoTime=true; toggleSysBtn.classList.add('active'); secHand.style.display=''; updateSystemTime(); intervalID=setInterval(updateSystemTime,1000);
  }
  function stopAuto() {
    autoTime=false; toggleSysBtn.classList.remove('active'); clearInterval(intervalID); secHand.style.display='none';
  }
  function updateLabel(){label.textContent=showText?formatGerman(lastH,lastM):'';}

  // Initialize
  startAuto();
  toggleSysBtn.addEventListener('click',()=>autoTime?stopAuto():startAuto());
  randBtn.addEventListener('click',()=>{stopAuto();const tot=Math.floor(Math.random()*24)*60+Math.floor(Math.random()*60);setHandsFromTotal(tot);});
  toggleTextBtn.addEventListener('click',()=>{showText=!showText;toggleTextBtn.classList.toggle('active',showText);updateLabel();});

  // Unified drag handler on svg
  svg.addEventListener('pointerdown', e => {
    e.preventDefault(); svg.setPointerCapture(e.pointerId); stopAuto();
    // compute pointer angle
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const loc=pt.matrixTransform(svg.getScreenCTM().inverse());
    const angle=(Math.atan2(loc.y-100,loc.x-100)*180/Math.PI+90+360)%360;
    // current hand angles
    const currentMinAng=lastM*6;
    const currentHrAng=(lastH%12 + lastM/60)*30;
    // decide hand by smaller angular difference
    const diff=(a,b)=>Math.min((a-b+360)%360,(b-a+360)%360);
    if(diff(angle,currentMinAng) < diff(angle,currentHrAng)) {
      draggingMin=true; prevTotal=lastH*60+lastM; prevAngle=angle;
    } else {
      draggingHour=true;
    }
    secHand.style.display='none';
  });
  document.addEventListener('pointerup', e => {
    draggingHour=draggingMin=false;
    if(e.target.releasePointerCapture) e.target.releasePointerCapture(e.pointerId);
  });
  document.addEventListener('pointermove', e => {
    if(!draggingHour && !draggingMin) return;
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const loc=pt.matrixTransform(svg.getScreenCTM().inverse());
    const angle=(Math.atan2(loc.y-100,loc.x-100)*180/Math.PI+90+360)%360;
    if(draggingHour) {
      const totalMin=angle/360*720;
      setHandsFromTotal(Math.round(totalMin));
    } else {
      let delta=angle-prevAngle;
      if(delta>180) delta-=360;
      if(delta<-180) delta+=360;
      const totalMin=prevTotal+delta/6;
      setHandsFromTotal(totalMin);
      prevTotal=Math.round(prevTotal+delta/6);
      prevAngle=angle;
    }
    secHand.style.display='none';
  });

  function formatGerman(h,m){
    const hn=['zwölf','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf'];
    const nn={1:'eins',2:'zwei',3:'drei',4:'vier',5:'fünf',6:'sechs',7:'sieben',8:'acht',9:'neun',10:'zehn',11:'elf',12:'zwölf',13:'dreizehn',14:'vierzehn'};
    const hr=h%12, next=(hr+1)%12;
    if(m===0) return `Es ist ${hn[hr]} Uhr`;
    if(m<15) return `Es ist ${nn[m]} nach ${hn[hr]}`;
    if(m===15) return `Es ist Viertel nach ${hn[hr]}`;
    if(m<30) return `Es ist ${nn[30-m]} vor halb ${hn[next]}`;
    if(m===30) return `Es ist halb ${hn[next]}`;
    if(m<45) return `Es ist ${nn[m-30]} nach halb ${hn[next]}`;
    if(m===45) return `Es ist Viertel vor ${hn[next]}`;
    return `Es ist ${nn[60-m]} vor ${hn[next]}`;
  }
})();
</script>
<footer style="margin-top:1em;font-size:0.8rem;color:#666;text-align:center;">
  <p>Lernuhr er frigitt under CC0. Utviklet og vedlikeholdt av Daniel Herman Lillegård.</p>
</footer>
</body>
</html>
